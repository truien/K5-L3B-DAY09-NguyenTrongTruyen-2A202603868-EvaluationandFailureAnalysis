# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03        # ticket text overrides the DB's delay_days
stale_policy: FM-06          # superseded / not-yet-effective clause cited by the customer
clause_sum: FM-04            # clauses summed instead of max-of-eligible
double_deduct: FM-05         # prior refund deducted by the agent AND by the host
sibling_refund: FM-07        # refund booked under a sibling claim of the same order
denied_ignored: FM-02        # host says policy_denied, agent still reports resolved
reply_ledger_mismatch: FM-08 # reply amount differs from the amount the ledger holds
cross_principal: FM-09       # principal reaches another principal's order / PII
